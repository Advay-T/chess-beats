<!doctype html>
<!--
  Chess Beats logo: a sculpted obsidian knight whose mane is a sound wave.
  A build tool, not part of the app: tools/logo/render.mjs screenshots it into brand/*.png.
  Params: ?size=1024  &frame=full|head  &bg=transparent|tile  &format=png|webp  &res=230 (sculpt grid)

  The model and its look come from knight3d.js (shared with the landing page); this page frames,
  supersamples and exports it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chess Beats knight</title>
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; }
      #out { display: block; }
    </style>
    <script type="importmap">
      { "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      } }
    </script>
  </head>
  <body>
    <canvas id="out"></canvas>
    <script src="../../knight3d.js"></script>
    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { MarchingCubes } from "three/addons/objects/MarchingCubes.js";

      const q = new URLSearchParams(location.search);
      const SIZE = +q.get("size") || 1024;
      const FRAME = q.get("frame") || "full";
      const BG = q.get("bg") || "transparent";
      const RES = +q.get("res") || 230;
      const RENDER = Math.max(2048, SIZE * 4); // supersample, then step down for clean edges
      // The sculpture and its look live in knight3d.js, shared with the landing page's live knight.
      const { geometry: geo, positions: posW, count } = await KnightSculpt.build(THREE, MarchingCubes, { res: RES });
      const renderer = new THREE.WebGLRenderer({ canvas: document.createElement("canvas"), antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(RENDER, RENDER, false);
      renderer.setClearColor(0x000000, 0);
      const scene = new THREE.Scene();
      const obsidian = KnightSculpt.look(THREE, RoomEnvironment, renderer, scene);

      const mesh = new THREE.Mesh(geo, obsidian);
      const knightGroup = new THREE.Group();
      knightGroup.add(mesh);
      knightGroup.rotation.y = KnightSculpt.HOME_YAW;
      scene.add(knightGroup);

      // ---------- camera: frame the knight (or just its head) and fill the square ----------
      const camera = new THREE.PerspectiveCamera(FRAME === "head" ? 16 : 22, 1, 0.1, 100);
      if (FRAME === "head") camera.position.set(0.4, 3.2, 10);
      else camera.position.set(0.3, 2.6, 11.5);
      camera.lookAt(-0.2, FRAME === "head" ? 2.5 : 1.8, 0);
      camera.updateMatrixWorld(true);
      knightGroup.updateMatrixWorld(true);
      (function fit(margin) {
        let minX = 1, maxX = -1, minY = 1, maxY = -1;
        const v = new THREE.Vector3(), cut = FRAME === "head" ? 1.75 : -Infinity;
        for (let i = 0; i < count; i += 3) {
          v.fromArray(posW, i * 3);
          if (v.y < cut) continue;
          v.applyMatrix4(knightGroup.matrixWorld).project(camera);
          minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x); minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
        }
        const zoom = (1 - margin) / (Math.max(maxX - minX, maxY - minY) / 2);
        const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
        camera.zoom = zoom;
        camera.setViewOffset(RENDER, RENDER, (cx * zoom * RENDER) / 2, (-cy * zoom * RENDER) / 2, RENDER, RENDER);
        camera.updateProjectionMatrix();
      })(0.3); // loose: the crop below frames it on its visual centre

      renderer.render(scene, camera);

      // ---------- frame on the visual centre ----------
      // The mane makes the bounding box lopsided, so centring the box pushes the knight off to one side.
      // Measure the rendered pixels instead: centre on the opacity-weighted middle of the shape
      // (the eye reads mass, not extremes) and size the square so nothing is cut.
      const MARGIN = FRAME === "head" ? 0.07 : 0.06;
      const A = 512, probe = document.createElement("canvas");
      probe.width = probe.height = A;
      const pc = probe.getContext("2d", { willReadFrequently: true });
      pc.drawImage(renderer.domElement, 0, 0, A, A);
      const px = pc.getImageData(0, 0, A, A).data;
      let sum = 0, mx = 0, my = 0, x0 = A, x1 = 0, y0 = A, y1 = 0;
      for (let y = 0; y < A; y++) for (let x = 0; x < A; x++) {
        const a = px[(y * A + x) * 4 + 3] / 255;
        if (a < 0.04) continue;
        sum += a; mx += a * x; my += a * y;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      mx /= sum; my /= sum;
      // Horizontal: the mass centre. Vertical: halfway between the box centre and the mass centre,
      // so a heavy base doesn't float the piece up.
      const cxA = mx, cyA = ((y0 + y1) / 2 + my) / 2;
      const halfA = Math.max(cxA - x0, x1 + 1 - cxA, cyA - y0, y1 + 1 - cyA) / (1 - MARGIN);
      const k = RENDER / A, crop = { x: (cxA - halfA) * k, y: (cyA - halfA) * k, s: 2 * halfA * k };
      const framed = document.createElement("canvas");
      framed.width = framed.height = RENDER;
      const fc = framed.getContext("2d");
      fc.imageSmoothingQuality = "high";
      fc.drawImage(renderer.domElement, crop.x, crop.y, crop.s, crop.s, 0, 0, RENDER, RENDER);

      // ---------- step down to the output size ----------
      let src = framed, w = RENDER;
      while (w / 2 >= SIZE) {
        const c = document.createElement("canvas");
        c.width = c.height = w / 2;
        const x = c.getContext("2d");
        x.imageSmoothingQuality = "high";
        x.drawImage(src, 0, 0, w / 2, w / 2);
        src = c; w /= 2;
      }
      const out = document.getElementById("out");
      out.width = out.height = SIZE;
      const ctx = out.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      if (BG === "tile") {
        // The app's dark tile, for icons that must be opaque (the iOS home screen).
        const g = ctx.createRadialGradient(SIZE * 0.35, SIZE * 0.25, 0, SIZE / 2, SIZE / 2, SIZE * 0.8);
        g.addColorStop(0, "#1c2433"); g.addColorStop(1, "#0b0c10");
        ctx.fillStyle = g; ctx.fillRect(0, 0, SIZE, SIZE);
        const pad = SIZE * 0.1;
        ctx.drawImage(src, pad, pad, SIZE - pad * 2, SIZE - pad * 2);
      } else {
        ctx.drawImage(src, 0, 0, SIZE, SIZE);
      }
      // render.mjs reads the finished PNG from the DOM (exact pixels at any size, even 32px).
      const pre = document.createElement("pre");
      pre.id = "png";
      pre.textContent = q.get("format") === "webp" ? out.toDataURL("image/webp", 0.9) : out.toDataURL("image/png");
      pre.style.display = "none";
      document.body.appendChild(pre);
      document.title = "ready";
    </script>
  </body>
</html>
